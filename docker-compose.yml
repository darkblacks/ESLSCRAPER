# Servidor: backend + HTTPS automático (Caddy) + atualização do IP no DuckDNS.
# Uso:  cp deploy.env.example .env  → preencha →  docker compose up -d
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3333
    volumes:
      - ./backend-data:/app/backend/data   # histórico e configurações (faça backup desta pasta)
    shm_size: "1gb"                        # o Chromium precisa de memória compartilhada
    expose:
      - "3333"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                   # certificados HTTPS
    depends_on:
      - backend

  duckdns:                                 # mantém o DOMINIO apontando para o IP do servidor
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMINIO}
      - TOKEN=${DUCKDNS_TOKEN}
      - TZ=America/Sao_Paulo

volumes:
  caddy-data:
